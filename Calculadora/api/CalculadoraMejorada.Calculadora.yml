    id: Factorial
    path: Calculadora/Program.cs
    startLine: 80
  assemblies:
  - Calculadora
  namespace: CalculadoraMejorada
  summary: >-
    Calcula el factorial de un número entero no negativo.

    El factorial de n es el producto de todos los enteros positivos desde 1 hasta n.

    Por convenio, el factorial de 0 es 1.
  example: []
  syntax:
    content: public long Factorial(int n)
    parameters:
    - id: n
      type: System.Int32
      description: Número entero del que se calcula el factorial. Debe estar entre 0 y 20.
    return:
      type: System.Int64
      description: El factorial de <code class="paramref">n</code> como un valor <code>long</code>.
    content.vb: Public Function Factorial(n As Integer) As Long
  overload: CalculadoraMejorada.Calculadora.Factorial*
  exceptions:
  - type: System.ArgumentException
    commentId: T:System.ArgumentException
    description: Se lanza cuando <code class="paramref">n</code> es negativo.
  - type: System.OverflowException
    commentId: T:System.OverflowException
    description: Se lanza cuando <code class="paramref">n</code> es mayor que 20, ya que el resultado supera la capacidad de un <code>long</code>.
  nameWithType.vb: Calculadora.Factorial(Integer)
  fullName.vb: CalculadoraMejorada.Calculadora.Factorial(Integer)
  name.vb: Factorial(Integer)
